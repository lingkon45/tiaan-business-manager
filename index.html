<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tiaan Business Manager</title>
<style>
:root{--navy:#14243a;--blue:#2459d3;--bg:#f4f6fa;--card:#fff;--muted:#697386;--line:#e4e8ef;--green:#16845b;--red:#b63838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033}header{background:var(--navy);color:#fff;padding:20px 16px 16px}header h1{font-size:21px;margin:0 0 4px}header p{margin:0;color:#c7d2e4;font-size:13px}.wrap{max-width:900px;margin:auto;padding:14px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:13px}.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:9px 13px;white-space:nowrap;color:#334155}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:0 2px 7px #1b2b4210}.metric small{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:21px;margin-top:6px;overflow-wrap:anywhere}.section{margin:16px 0 9px;font-size:17px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;background:var(--blue);color:#fff;padding:11px 13px;border-radius:10px;font-weight:600}.btn.secondary{background:#e9eefc;color:#2147a4}.btn.danger{background:#fff0f0;color:var(--red)}input,select{width:100%;padding:11px;border:1px solid #d7deea;border-radius:9px;background:#fff;font:inherit;margin:4px 0 10px}label{font-size:12px;color:var(--muted);display:block}form{margin-top:10px}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{display:block}.muted{color:var(--muted);font-size:12px}.right{margin-left:auto}.pill{display:inline-block;background:#edf2ff;color:#2648a0;padding:4px 8px;border-radius:99px;font-size:11px}.empty{padding:16px 0;color:var(--muted)}.memo{border:1px dashed #aeb8c9;padding:14px;border-radius:10px;background:#fff}.memo h3{text-align:center;margin:0}.memo p{text-align:center;margin:4px 0 12px;color:var(--muted)}@media(min-width:650px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.wrap{padding:20px}}
</style></head><body>
<header><h1>Tiaan Business Manager</h1><p>Three businesses · Inventory · Sales · Expenses · Cash memos</p></header>
<div class="wrap">
<div class="tabs" id="businessTabs"></div>
<div class="grid" id="metrics"></div>
<div class="row" style="margin-top:13px"><button class="btn" onclick="showPanel('sale')">＋ New sale</button><button class="btn secondary" onclick="showPanel('product')">＋ Add product</button><button class="btn secondary" onclick="showPanel('expense')">＋ Add expense</button></div>
<div id="forms"></div>
<h2 class="section">Stock & products</h2><div class="card" id="products"></div>
<h2 class="section">Recent sales / cash memos</h2><div class="card" id="sales"></div>
<h2 class="section">Expenses</h2><div class="card" id="expenses"></div>
<div class="row" style="margin-top:14px"><button class="btn secondary" onclick="exportData()">Export backup (JSON)</button><button class="btn danger" onclick="resetData()">Clear all app data</button></div>
<p class="muted" style="margin-top:14px">Saved on this device only. Export backups regularly. Cloud synchronization is not configured in this starter.</p>
</div>
<script>
const names=['All businesses','Tiaan Tech','Tiaan Mart','China Bridge'];
const defaults={businesses:['Tiaan Tech','Tiaan Mart','China Bridge'],products:[],sales:[],expenses:[],nextSale:1001};
let db; try{db=JSON.parse(localStorage.getItem('tiaanBizDB'))||structuredClone(defaults)}catch(e){db=JSON.parse(JSON.stringify(defaults))}
let current='All businesses', panel='';
function save(){localStorage.setItem('tiaanBizDB',JSON.stringify(db));render()}
function money(n){return '৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2})}
function belongs(x){return current==='All businesses'||x.business===current}
function el(id){return document.getElementById(id)}
function render(){
 el('businessTabs').innerHTML=names.map(n=>`<button class="tab ${current===n?'active':''}" onclick="current=${JSON.stringify(n)};render()">${n}</button>`).join('');
 const ps=db.products.filter(belongs), ss=db.sales.filter(belongs), es=db.expenses.filter(belongs);
 const revenue=ss.reduce((a,s)=>a+s.total,0), cogs=ss.reduce((a,s)=>a+s.cost,0), exp=es.reduce((a,e)=>a+e.amount,0);
 const stock=ps.reduce((a,p)=>a+p.qty,0), stockValue=ps.reduce((a,p)=>a+p.qty*p.buy,0);
 const profit=revenue-cogs-exp;
 el('metrics').innerHTML=[['Sales revenue',money(revenue)],['Estimated net profit',money(profit)],['Units in stock',stock.toLocaleString()],['Stock cost value',money(stockValue)]].map(m=>`<div class="card metric"><small>${m[0]}</small><strong>${m[1]}</strong></div>`).join('');
 el('products').innerHTML=ps.length?ps.map(p=>`<div class="item"><div class="row"><b>${esc(p.name)}</b><span class="pill">${esc(p.business)}</span><span class="right">${p.qty} in stock</span></div><div class="muted">SKU: ${esc(p.sku||'—')} · Buy ${money(p.buy)} · Sell ${money(p.sell)} <button class="btn secondary" onclick="adjustStock(${p.id})">Adjust stock</button> <button class="btn danger" onclick="delProduct(${p.id})">Delete</button></div></div>`).join(''):'<div class="empty">No products yet. Add products to start tracking stock.</div>';
 el('sales').innerHTML=ss.slice().reverse().slice(0,30).map(s=>`<div class="item"><div class="row"><b>Memo #${s.memo}</b><span class="pill">${esc(s.business)}</span><span class="right">${money(s.total)}</span></div><div class="muted">${esc(s.date)} · ${esc(s.customer||'Walk-in customer')} · ${esc(s.payment)} · ${s.lines.map(l=>esc(l.name)+' × '+l.qty).join(', ')}</div><button class="btn secondary" onclick="printMemo(${s.id})">View / print memo</button></div>`).join('')||'<div class="empty">No sales recorded yet.</div>';
 el('expenses').innerHTML=es.slice().reverse().slice(0,20).map(e=>`<div class="item"><div class="row"><b>${esc(e.title)}</b><span class="pill">${esc(e.business)}</span><span class="right">${money(e.amount)}</span></div><div class="muted">${esc(e.date)} · ${esc(e.payment)}</div></div>`).join('')||'<div class="empty">No expenses recorded yet.</div>';
 if(panel) renderForm();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bizSelect(v=''){return `<select name="business" required>${db.businesses.map(b=>`<option ${v===b?'selected':''}>${esc(b)}</option>`).join('')}</select>`}
function showPanel(p){panel=p;renderForm();el('forms').scrollIntoView({behavior:'smooth',block:'start'})}
function renderForm(){
 let html='';
 if(panel==='product') html=`<div class="card"><h3>Add product / stock</h3><form onsubmit="addProduct(event)">${bizSelect(current==='All businesses'?'Tiaan Tech':current)}<label>Product name</label><input name="name" required><label>SKU / model (optional)</label><input name="sku"><div class="grid"><div><label>Purchase cost (৳)</label><input name="buy" type="number" min="0" step=".01" required></div><div><label>Selling price (৳)</label><input name="sell" type="number" min="0" step=".01" required></div><div><label>Opening quantity</label><input name="qty" type="number" min="0" step="1" required value="0"></div></div><button class="btn">Save product</button> <button type="button" class="btn secondary" onclick="panel='';el('forms').innerHTML=''">Cancel</button></form></div>`;
 if(panel==='sale') html=`<div class="card"><h3>New sale / English cash memo</h3><form onsubmit="addSale(event)">${bizSelect(current==='All businesses'?'Tiaan Tech':current)}<label>Customer name (optional)</label><input name="customer" placeholder="Walk-in customer"><label>Product</label><select name="product" required>${db.products.filter(p=>current==='All businesses'||p.business===current).map(p=>`<option value="${p.id}">${esc(p.name)} — stock ${p.qty} — ${money(p.sell)}</option>`).join('')}</select><div class="grid"><div><label>Quantity</label><input name="qty" type="number" min="1" step="1" required value="1"></div><div><label>Payment method</label><select name="payment"><option>Cash</option><option>Digital payment</option><option>Mixed</option></select></div></div><label>Discount (৳)</label><input name="discount" type="number" min="0" step=".01" value="0"><button class="btn">Save sale & create memo</button> <button type="button" class="btn secondary" onclick="panel='';el('forms').innerHTML=''">Cancel</button></form></div>`;
 if(panel==='expense') html=`<div class="card"><h3>Record expense</h3><form onsubmit="addExpense(event)">${bizSelect(current==='All businesses'?'Tiaan Tech':current)}<label>Expense title</label><input name="title" required placeholder="Rent, transport, electricity…"><label>Amount (৳)</label><input name="amount" type="number" min=".01" step=".01" required><label>Payment method</label><select name="payment"><option>Cash</option><option>Digital payment</option></select><button class="btn">Save expense</button> <button type="button" class="btn secondary" onclick="panel='';el('forms').innerHTML=''">Cancel</button></form></div>`;
 el('forms').innerHTML=html;
}
function addProduct(e){e.preventDefault();let f=new FormData(e.target);db.products.push({id:Date.now(),business:f.get('business'),name:f.get('name'),sku:f.get('sku'),buy:+f.get('buy'),sell:+f.get('sell'),qty:+f.get('qty')});panel='';save()}
function addSale(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===+f.get('product')),q=+f.get('qty');if(!p){alert('Add a product first.');return}if(q>p.qty){alert('Not enough stock. Available: '+p.qty);return}let discount=+f.get('discount');let total=Math.max(0,p.sell*q-discount);let s={id:Date.now(),memo:db.nextSale++,business:p.business,customer:f.get('customer'),date:new Date().toLocaleString('en-GB'),payment:f.get('payment'),lines:[{name:p.name,qty:q,price:p.sell}],total,cost:p.buy*q,discount};p.qty-=q;db.sales.push(s);panel='';save();printMemo(s.id)}
function addExpense(e){e.preventDefault();let f=new FormData(e.target);db.expenses.push({id:Date.now(),business:f.get('business'),title:f.get('title'),amount:+f.get('amount'),payment:f.get('payment'),date:new Date().toLocaleString('en-GB')});panel='';save()}
function adjustStock(id){let p=db.products.find(p=>p.id===id),v=prompt('Enter new stock quantity for '+p.name,p.qty);if(v!==null&&v.trim()!==''&&Number.isFinite(+v)&&+v>=0){p.qty=+v;save()}}
function delProduct(id){if(confirm('Delete this product? Past sales remain in reports.')){db.products=db.products.filter(p=>p.id!==id);save()}}
function printMemo(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank');if(!w){alert('Allow pop-ups to view the memo.');return}w.document.write(`<html><head><title>Cash Memo ${s.memo}</title><style>body{font:15px Arial;padding:25px;color:#111}h2,p{text-align:center}table{width:100%;border-collapse:collapse;margin:20px 0}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}.total{text-align:right;font-size:20px;font-weight:bold}</style></head><body><h2>${esc(s.business)}</h2><p>SALES CASH MEMO</p><hr><p>Memo No: ${s.memo} &nbsp; Date: ${esc(s.date)}</p><p style="text-align:left">Customer: ${esc(s.customer||'Walk-in customer')}<br>Payment: ${esc(s.payment)}</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>${s.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</table><p class="total">Discount: ${money(s.discount)}<br>Grand Total: ${money(s.total)}</p><p>Thank you for your business!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tiaan-business-backup.json';a.click();URL.revokeObjectURL(u)}
function resetData(){if(confirm('This permanently deletes all products, sales and expenses stored in this app. Export a backup first. Continue?')){db=JSON.parse(JSON.stringify(defaults));save()}}
render();
</script></body></html>
